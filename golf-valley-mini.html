<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Golf Valley</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#38bdf8,#bae6fd);font-family:system-ui;color:#fff;min-height:100vh;display:grid;place-items:center}.g{width:min(96vw,900px)}.bar,.msg,.info{background:#51351d;border:3px solid #26170c;border-radius:12px;padding:10px;margin:7px 0}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}canvas{width:100%;height:auto;display:block;background:#3f8f2f;border:4px solid #14532d;border-radius:14px;image-rendering:pixelated}.bottom{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px}.pad button,.club{height:48px;border:0;border-radius:10px;background:#fde68a;color:#422006;font-weight:900;font-size:18px}.pad .e{background:#facc15}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px}.modal.show{display:grid}.box{background:#fff7df;color:#422006;padding:18px;border-radius:14px;border:4px solid #5b3719;width:min(100%,560px);max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;margin:6px 0}.box button{padding:10px;border:0;border-radius:9px;color:#fff;background:#2563eb;font-weight:800;margin:4px}.box .x{background:#4b5563}.box .save{background:#16a34a}.box .danger{background:#dc2626}@media(max-width:600px){.bottom{grid-template-columns:1fr}.pad{justify-content:center}}</style><body><main class="g"><div class="bar"><b id="stats"></b><b id="day"></b></div><canvas id="c" width="600" height="400"></canvas><div class="msg" id="msg">Willkommen in Golf Valley!</div><div class="bottom"><div class="info"><b id="tile"></b><div id="desc"></div><button class="club" id="club">🏠 Clubhaus öffnen</button></div><div class="pad"><i></i><button data-d="u">▲</button><i></i><button data-d="l">◀</button><button class="e" id="e">E</button><button data-d="r">▶</button><i></i><button data-d="d">▼</button><i></i></div></div></main><div class="modal" id="m"><div class="box"><h2>🏠 Clubhaus</h2><div class="row"><span>Geld</span><b id="cm"></b></div><div class="row"><span>Mitglieder</span><b id="mem"></b></div><div class="row"><span>Tageskosten</span><b id="cost"></b></div><h3>Personal</h3><div id="staff"></div><button class="save" id="save">💾 Speichern</button><button id="load">📂 Laden</button><button id="sleep">💤 Schlafen</button><button class="danger" id="reset">🔄 Neustart</button><button class="x" id="close">Zurück</button></div></div><script>(()=>{const C=document.querySelector('#c'),x=C.getContext('2d'),$=s=>document.querySelector(s),W=15,H=10,S=40,K='golf-valley-save';const spots={'3,2':0,'8,3':1,'11,6':2,'4,7':3,'10,8':4},names=['Birkenblick','Seerosenteich','Falkenhöhe','Waldlichtung','Sonnenhang'];const roles={g:['🌿 Greenkeeper',900,90,3],r:['🛎️ Rezeption',700,70,2],t:['🏌️ Trainer',1100,110,2]};function tiles(){let a=[];for(let y=0;y<H;y++)for(let z=0;z<W;z++){let q='grass',h=-1;if(z==5&&y==5)q='club';else if(spots[z+','+y]!=null){q='spot';h=spots[z+','+y]}else if(!z||!y||z==W-1||y==H-1)q='fence';a.push({x:z,y,q,h,l:0,c:100})}return a}function fresh(){return{money:2500,en:100,rep:5,d:1,time:6,season:'Frühling',p:{x:5,y:5},tiles:tiles(),members:0,total:0,staff:{g:0,r:0,t:0},weather:'☀️ Sonnig'}}let s=fresh();const at=(a,b)=>s.tiles.find(t=>t.x==a&&t.y==b),holes=()=>s.tiles.filter(t=>t.q=='hole').length,wages=()=>Object.keys(roles).reduce((n,k)=>n+s.staff[k]*roles[k][2],0),cost=()=>60+holes()*35+wages();function say(v){$('#msg').textContent=v}function draw(){x.clearRect(0,0,600,400);for(const t of s.tiles){let X=t.x*S,Y=t.y*S;x.fillStyle=t.q=='fence'?'#3f6212':t.q=='hole'?'#4ade80':'#65a30d';x.fillRect(X,Y,S,S);if(t.q=='fence'){x.fillStyle='#854d0e';x.fillRect(X,Y+17,S,6)}if(t.q=='spot'){x.fillStyle='#fde68a';x.fillRect(X+8,Y+8,24,24);x.fillStyle='#92400e';x.font='18px sans-serif';x.fillText('⚒',X+11,Y+28)}if(t.q=='club'){x.fillStyle='#92400e';x.fillRect(X+6,Y+15,28,20);x.fillStyle='#dc2626';x.beginPath();x.moveTo(X+4,Y+16);x.lineTo(X+20,Y+3);x.lineTo(X+36,Y+16);x.fill()}if(t.q=='hole'){x.fillStyle='#14532d';x.beginPath();x.arc(X+20,Y+25,10,0,7);x.fill();x.strokeStyle='#fff';x.beginPath();x.moveTo(X+20,Y+25);x.lineTo(X+20,Y+7);x.stroke();x.fillStyle='#ef4444';x.fillRect(X+20,Y+7,12,7)}}let X=s.p.x*S,Y=s.p.y*S;x.fillStyle='#fde047';x.beginPath();x.arc(X+20,Y+17,8,0,7);x.fill();x.fillStyle='#1d4ed8';x.fillRect(X+13,Y+25,14,12)}function ui(){draw();$('#stats').textContent=`💵 $${s.money}  ⚡ ${s.en}  🏆 ${s.rep}  ⛳ ${holes()}`;$('#day').textContent=`${s.season} · Tag ${s.d} · ${String(s.time).padStart(2,'0')}:00 · ${s.weather}`;let t=at(s.p.x,s.p.y),n='🌱 Gras',d='Hier gibt es nichts zu tun.';if(t.q=='club'){n='🏠 Clubhaus';d='Personal und Spielstand verwalten.'}if(t.q=='spot'){n='⚒ '+names[t.h];d='Bahn für $500 bauen.'}if(t.q=='hole'){n='⛳ '+names[t.h];d=`Level ${t.l} · Zustand ${t.c}%`}$('#tile').textContent=n;$('#desc').textContent=d;$('#club').style.display=t.q=='club'?'block':'none'}function move(a,b){s.p.x=Math.max(1,Math.min(W-2,s.p.x+a));s.p.y=Math.max(1,Math.min(H-2,s.p.y+b));ui()}function act(){let t=at(s.p.x,s.p.y);if(t.q=='club')return open();if(t.q=='spot'){if(s.money<500||s.en<20)return say('❌ $500 und 20 Energie nötig.');s.money-=500;s.en-=20;s.rep+=10;t.q='hole';t.l=1;say('⛳ Bahn gebaut!')}else if(t.q=='hole'&&t.c<70){if(s.money<180)return say('❌ $180 nötig.');s.money-=180;t.c=100;say('🔧 Bahn repariert.')}else say('Hier gibt es aktuell nichts zu tun.');ui()}function open(){renderStaff();$('#cm').textContent='$'+s.money;$('#mem').textContent=s.members;$('#cost').textContent='$'+cost();$('#m').classList.add('show')}function close(){$('#m').classList.remove('show');ui()}function renderStaff(){$('#staff').innerHTML=Object.keys(roles).map(k=>{let r=roles[k];return `<div class=row><span>${r[0]} (${s.staff[k]}/${r[3]}) · $${r[1]} / $${r[2]} täglich</span><span><button data-h=${k}>+</button><button data-f=${k}>−</button></span></div>`}).join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>hire(b.dataset.h));document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>fire(b.dataset.f))}function hire(k){let r=roles[k];if(s.staff[k]>=r[3]||s.money<r[1])return say('❌ Einstellung nicht möglich.');s.money-=r[1];s.staff[k]++;open();ui()}function fire(k){if(s.staff[k])s.staff[k]--;open();ui()}function day(){s.d++;s.time=6;s.en=100;s.money-=cost();s.rep+=s.staff.t;s.tiles.forEach(t=>{if(t.q=='hole')t.c=Math.max(0,t.c-Math.max(0,3-s.staff.g))});s.weather=['☀️ Sonnig','☁️ Bewölkt','🌧️ Regen','⛈️ Sturm'][Math.floor(Math.random()*4)];close();say('Neuer Tag. Betriebskosten wurden abgebucht.')}setInterval(()=>{s.time++;if(s.time>=24)day();ui()},10000);document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let d=b.dataset.d;move(d=='l'?-1:d=='r'?1:0,d=='u'?-1:d=='d'?1:0)});$('#e').onclick=act;$('#club').onclick=open;$('#close').onclick=close;$('#save').onclick=()=>{localStorage.setItem(K,JSON.stringify(s));say('💾 Gespeichert.')};$('#load').onclick=()=>{let q=localStorage.getItem(K);if(q){s=Object.assign(fresh(),JSON.parse(q));close();say('📂 Geladen.')}};$('#sleep').onclick=()=>{if(s.time<18)return say('⏰ Schlafen erst ab 18:00.');day()};$('#reset').onclick=()=>{if(confirm('Neues Spiel?')){s=fresh();close();say('Neues Spiel gestartet.')}};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k=='w'||k=='arrowup')move(0,-1);if(k=='s'||k=='arrowdown')move(0,1);if(k=='a'||k=='arrowleft')move(-1,0);if(k=='d'||k=='arrowright')move(1,0);if(k=='e'||k==' ')act()});ui()})();</script></body></html>
